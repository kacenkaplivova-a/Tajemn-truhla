<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tajemná Truhla – 3D Mechanický Zámek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #1b2836;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-fantasy {
            font-family: 'Cinzel', serif;
        }

        #webgl-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #chest-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        @keyframes ambientFloat {
            0% {
                transform: translateY(0px) translateX(0px);
                opacity: 0;
            }
            25% {
                opacity: 0.65;
            }
            75% {
                opacity: 0.45;
            }
            100% {
                transform: translateY(-110px) translateX(22px);
                opacity: 0;
            }
        }

        .ambient-dust {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(253, 224, 71, 0.85) 0%, rgba(245, 158, 11, 0.15) 70%, transparent 100%);
            pointer-events: none;
            z-index: 2;
            animation: ambientFloat linear infinite;
        }

        @keyframes rotateRays {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.06); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }

        .gold-rays {
            position: fixed;
            top: 46%;
            left: 50%;
            width: 540px;
            height: 540px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
            background: repeating-conic-gradient(
                from 0deg,
                rgba(253, 224, 71, 0.25) 0deg 8deg,
                transparent 8deg 22deg
            );
            mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 12%, rgba(0, 0, 0, 0) 68%);
            -webkit-mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 12%, rgba(0, 0, 0, 0) 68%);
            transition: opacity 1.2s ease 0.3s;
        }

        .chest-open .gold-rays {
            opacity: 1;
            animation: rotateRays 22s linear infinite;
        }

        @keyframes riseSparkle {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-170px) scale(0.15);
                opacity: 0;
            }
        }

        .treasure-sparkle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, #fef08a 0%, #f59e0b 65%, transparent 100%);
            box-shadow: 0 0 12px #fbbf24, 0 0 22px #f59e0b;
            pointer-events: none;
            z-index: 5;
            animation: riseSparkle 2.1s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-100">

    <!-- Vrstva pro okolní prachové částice a zlaté paprsky -->
    <div id="ambient-dust-layer" class="fixed inset-0 pointer-events-none z-0"></div>
    <div id="gold-rays" class="gold-rays"></div>
    <div id="sparkles-layer" class="fixed inset-0 pointer-events-none z-10"></div>

    <!-- Hlavní 3D scéna (100vw x 100vh) -->
    <div id="webgl-container">
        <canvas id="chest-canvas"></canvas>
    </div>

    <!-- Horní hlavička s nadpisem a stavem -->
    <header class="fixed top-0 left-0 right-0 pt-6 sm:pt-8 px-4 text-center pointer-events-none z-20">
        <h1 class="font-fantasy text-3xl sm:text-5xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-b from-amber-100 via-amber-400 to-amber-700 drop-shadow-[0_4px_18px_rgba(0,0,0,0.75)]">
            TAJEMNÁ TRUHLA
        </h1>
        <p id="status-text" class="mt-2 text-base sm:text-lg font-semibold text-amber-200 tracking-wide drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)] transition-all duration-300">
            Klikni na truhlu
        </p>
    </header>

    <!-- Nenápadný ovládací pruh pro 8 bubínků zámku (zobrazí se po přiblížení) -->
    <div id="dial-controls-bar" class="fixed bottom-4 sm:bottom-8 left-1/2 -translate-x-1/2 translate-y-8 opacity-0 pointer-events-none transition-all duration-500 ease-out z-20 w-[96%] max-w-xl">
        <div class="bg-slate-950/80 backdrop-blur-md border border-amber-500/35 rounded-2xl px-2.5 sm:px-4 py-2.5 sm:py-3 shadow-[0_10px_35px_rgba(0,0,0,0.75)]">
            <div class="flex items-center justify-center gap-1 sm:gap-2" id="dial-buttons-row">
                <!-- 8 sloupců tlačítek ▲ / ▼ se vygeneruje skriptem -->
            </div>
            <p class="text-center text-[11px] sm:text-xs text-slate-300 mt-2">
                Otáčej kolečky myší, klikáním na válce nebo tlačítky <span class="text-amber-400 font-semibold">▲ / ▼</span>
            </p>
        </div>
    </div>

    <!-- Text o pokladu uprostřed dole po otevření truhly -->
    <div id="victory-panel" class="fixed bottom-6 sm:bottom-8 left-1/2 -translate-x-1/2 translate-y-8 opacity-0 pointer-events-none transition-all duration-500 ease-out z-20 w-[92%] max-w-sm">
        <div class="bg-slate-950/85 backdrop-blur-md border border-amber-400/50 rounded-2xl p-4 sm:p-5 text-center shadow-[0_15px_45px_rgba(0,0,0,0.75)]">
            <h2 class="font-fantasy text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200 mb-1">
                POKLAD JE VÁŠ!
            </h2>
            <p class="text-slate-300 text-xs sm:text-sm">
                Mechanický zámek povolil a odhalil královské bohatství.
            </p>
        </div>
    </div>

    <!-- Tlačítko pro opětovné zamčení v pravém dolním rohu -->
    <button id="reset-btn" type="button" onclick="resetChest()" class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 translate-y-8 opacity-0 pointer-events-none py-2.5 px-4 sm:px-5 bg-slate-950/85 hover:bg-amber-500 text-amber-200 hover:text-slate-950 font-semibold text-xs sm:text-sm rounded-xl border border-amber-400/50 shadow-[0_10px_25px_rgba(0,0,0,0.75)] backdrop-blur-md active:scale-95 transition-all duration-500 ease-out cursor-pointer z-20">
        Znovu zamknout truhlu
    </button>

    <script>
        // =========================================================================
        // 1. KONFIGURACE A STAV APLIKACE
        // =========================================================================
        const SECRET_COMBINATION = [3, 1, 3, 0, 3, 1, 3, 9];
        const DIAL_COUNT = 8;

        // Rozměry 3D truhly
        const W = 3.6;
        const H = 1.45;
        const D = 2.1;
        const wallT = 0.14;

        let dialValues = new Array(DIAL_COUNT).fill(0);
        let dialVisualSteps = new Array(DIAL_COUNT).fill(0);
        let dialCurrentAngles = new Array(DIAL_COUNT).fill(0);

        let appPhase = 'IDLE'; // 'IDLE' | 'ZOOMED' | 'UNLOCKING' | 'OPEN'
        let unlockTimeout = null;
        let sparkleInterval = null;

        // DOM reference
        const statusText = document.getElementById('status-text');
        const dialControlsBar = document.getElementById('dial-controls-bar');
        const dialButtonsRow = document.getElementById('dial-buttons-row');
        const victoryPanel = document.getElementById('victory-panel');
        const resetBtn = document.getElementById('reset-btn');
        const sparklesLayer = document.getElementById('sparkles-layer');
        const ambientDustLayer = document.getElementById('ambient-dust-layer');
        const canvas = document.getElementById('chest-canvas');

        // =========================================================================
        // 2. ZVUKOVÉ EFEKTY (WEB AUDIO API)
        // =========================================================================
        let audioCtx = null;

        function ensureAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playDialClick(direction = 1) {
            try {
                ensureAudioContext();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                const baseFreq = direction > 0 ? 920 : 840;
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(240, now + 0.045);

                gain.gain.setValueAtTime(0.14, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.055);
            } catch (e) {}
        }

        function playLatchReleaseSound() {
            try {
                ensureAudioContext();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                [520, 780].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    osc.frequency.exponentialRampToValueAtTime(160, now + idx * 0.07 + 0.12);

                    gain.gain.setValueAtTime(0.16, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.13);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.14);
                });
            } catch (e) {}
        }

        function playVictoryFanfare() {
            try {
                ensureAudioContext();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, idx) => {
                    const start = now + idx * 0.11;
                    const dur = idx === notes.length - 1 ? 0.75 : 0.28;

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, start);

                    gain.gain.setValueAtTime(0.001, start);
                    gain.gain.linearRampToValueAtTime(0.18, start + 0.025);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(start);
                    osc.stop(start + dur + 0.02);
                });
            } catch (e) {}
        }

        // =========================================================================
        // 3. PROCEDURÁLNÍ TEXTURY (DŘEVO, ČÍSLICE ZÁMKU, KAMENÍ ZŘÍCENINY)
        // =========================================================================
        function createMahoganyTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 512;
            const ctx = c.getContext('2d');

            ctx.fillStyle = '#2b1106';
            ctx.fillRect(0, 0, 512, 512);

            for (let y = 0; y < 512; y += 2) {
                const wave = Math.sin(y * 0.06) * 10 + Math.cos(y * 0.018) * 14;
                const shade = 26 + Math.floor(Math.abs(wave));
                ctx.fillStyle = `rgba(${shade + 24}, ${Math.floor(shade * 0.45)}, ${Math.floor(shade * 0.18)}, 0.42)`;
                ctx.fillRect(0, y, 512, 2);
            }

            const plankCount = 4;
            const plankH = 512 / plankCount;
            for (let p = 1; p < plankCount; p++) {
                const py = p * plankH;
                ctx.fillStyle = 'rgba(10, 3, 1, 0.85)';
                ctx.fillRect(0, py - 2, 512, 4);
                ctx.fillStyle = 'rgba(92, 44, 18, 0.35)';
                ctx.fillRect(0, py + 2, 512, 2);
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createDialNumberTexture() {
            const c = document.createElement('canvas');
            c.width = 1024;
            c.height = 128;
            const ctx = c.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, 128);
            grad.addColorStop(0.0, '#6b4714');
            grad.addColorStop(0.11, '#f3d47a');
            grad.addColorStop(0.5, '#fff6d1');
            grad.addColorStop(0.89, '#f3d47a');
            grad.addColorStop(1.0, '#6b4714');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 128);

            for (let x = 0; x < 1024; x += 8) {
                ctx.fillStyle = '#1c1104';
                ctx.fillRect(x, 0, 4, 11);
                ctx.fillRect(x, 117, 4, 11);
            }

            const step = 1024 / 10;

            for (let i = 0; i <= 10; i++) {
                const digit = i % 10;
                const cx = i * step;

                const divX = cx + step * 0.5;
                ctx.fillStyle = '#3d2608';
                ctx.fillRect(divX - 2, 11, 4, 106);

                ctx.save();
                ctx.translate(cx, 64);
                ctx.rotate(Math.PI / 2);

                ctx.font = '900 68px "Inter", "Arial Black", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.lineWidth = 5;
                ctx.strokeStyle = 'rgba(255, 250, 230, 0.85)';
                ctx.strokeText(String(digit), 0, 0);

                ctx.fillStyle = '#050301';
                ctx.fillText(String(digit), 0, 0);

                ctx.restore();
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.anisotropy = 8;
            return tex;
        }

        function createRuinedStoneTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 512;
            const ctx = c.getContext('2d');

            ctx.fillStyle = '#262b26';
            ctx.fillRect(0, 0, 512, 512);

            let y = 0;
            let rowIdx = 0;
            while (y < 512) {
                const rowH = 38 + ((rowIdx * 19) % 28);
                let x = -((rowIdx * 37) % 60);
                let colIdx = 0;

                while (x < 512) {
                    const stoneW = 54 + ((rowIdx * 23 + colIdx * 41) % 58);
                    const shade = 74 + ((rowIdx * 13 + colIdx * 29) % 38);
                    const warmShift = ((rowIdx + colIdx) % 3) * 5;

                    ctx.fillStyle = `rgb(${shade + warmShift}, ${shade + 2}, ${shade - 4})`;
                    ctx.beginPath();
                    ctx.moveTo(x + 4, y + 3);
                    ctx.lineTo(x + stoneW - 5, y + 2 + (colIdx % 3));
                    ctx.lineTo(x + stoneW - 3, y + rowH - 4);
                    ctx.lineTo(x + 3 + (rowIdx % 3), y + rowH - 3);
                    ctx.closePath();
                    ctx.fill();

                    if ((rowIdx * 7 + colIdx * 11) % 4 === 0) {
                        ctx.fillStyle = 'rgba(54, 92, 36, 0.42)';
                        ctx.beginPath();
                        ctx.arc(x + stoneW * 0.45, y + rowH * 0.65, Math.min(stoneW, rowH) * 0.34, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.strokeStyle = 'rgba(170, 175, 165, 0.22)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    x += stoneW;
                    colIdx++;
                }
                y += rowH;
                rowIdx++;
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createBarkTexture() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');

            ctx.fillStyle = '#3b2718';
            ctx.fillRect(0, 0, 256, 256);

            for (let x = 0; x < 256; x += 4) {
                const dark = (x * 17) % 24;
                ctx.fillStyle = `rgb(${46 + dark}, ${30 + Math.floor(dark * 0.6)}, ${18 + Math.floor(dark * 0.4)})`;
                ctx.fillRect(x, 0, 3, 256);
            }
            for (let i = 0; i < 90; i++) {
                const bx = (i * 53) % 250;
                const by = (i * 89) % 240;
                ctx.fillStyle = 'rgba(20, 11, 5, 0.55)';
                ctx.fillRect(bx, by, 3, 18 + (i % 22));
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // =========================================================================
        // 4. INICIALIZACE 3D SCÉNY, PROSTŘEDÍ HRADNÍ ZŘÍCENINY A TRUHLY
        // =========================================================================
        let scene, camera, renderer;
        let chestRoot, lidPivot, latchSlider, treasureGroup, treasureLight;
        let dialPivots = [];
        let dialMeshes = [];
        let interactiveTargets = [];
        let dustPoints3D = null;

        let currentChestRotY = -0.35;
        let targetChestRotY = -0.35;

        const CAM_IDLE = { pos: new THREE.Vector3(0, 4.1, 11.8), look: new THREE.Vector3(0, 1.45, 0) };
        const CAM_ZOOM = { pos: new THREE.Vector3(0, 2.42, 5.45), look: new THREE.Vector3(0, 1.48, 1.05) };
        const CAM_OPEN = { pos: new THREE.Vector3(0, 3.85, 8.6), look: new THREE.Vector3(0, 1.75, 0) };

        let camCurrentPos = CAM_IDLE.pos.clone();
        let camTargetPos = CAM_IDLE.pos.clone();
        let camCurrentLook = CAM_IDLE.look.clone();
        let camTargetLook = CAM_IDLE.look.clone();

        const raycaster = new THREE.Raycaster();
        const mouseNDC = new THREE.Vector2();

        function init3DScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#86a9c4');
            scene.fog = new THREE.FogExp2('#8aa9bd', 0.017);

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 150);
            camera.position.copy(camCurrentPos);
            camera.lookAt(camCurrentLook);

            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true,
                preserveDrawingBuffer: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.04;

            const hemiLight = new THREE.HemisphereLight('#d9eeff', '#476832', 0.92);
            scene.add(hemiLight);

            const sunLight = new THREE.DirectionalLight('#ffebb8', 1.45);
            sunLight.position.set(12, 19, 10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 1;
            sunLight.shadow.camera.far = 58;
            const dCam = 19;
            sunLight.shadow.camera.left = -dCam;
            sunLight.shadow.camera.right = dCam;
            sunLight.shadow.camera.top = dCam;
            sunLight.shadow.camera.bottom = -dCam;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            const softFillLight = new THREE.DirectionalLight('#e3f0fa', 0.32);
            softFillLight.position.set(-4, 5, 10);
            scene.add(softFillLight);

            const mahoganyTex = createMahoganyTexture();
            const woodMat = new THREE.MeshStandardMaterial({
                map: mahoganyTex,
                roughness: 0.62,
                metalness: 0.08,
                side: THREE.DoubleSide
            });

            const darkInnerMat = new THREE.MeshStandardMaterial({
                color: '#140602',
                roughness: 0.85,
                metalness: 0.05
            });

            const goldMat = new THREE.MeshStandardMaterial({
                color: '#eab308',
                metalness: 0.76,
                roughness: 0.32
            });

            const brassDarkMat = new THREE.MeshStandardMaterial({
                color: '#9a6715',
                metalness: 0.70,
                roughness: 0.42
            });

            const ironDarkMat = new THREE.MeshStandardMaterial({
                color: '#1e242b',
                metalness: 0.65,
                roughness: 0.52
            });

            buildCastleRuinsEnvironment();
            buildChestAndLock(woodMat, darkInnerMat, goldMat, brassDarkMat, ironDarkMat);
            buildTreasure(goldMat);
            buildAmbientParticles3D();

            buildDialControlButtons();
            createAmbientDustDOM();
            setupPointerAndWheelEvents();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // =========================================================================
        // 4B. ŽIVÁ PŘÍRODA A ROZBOŘENÁ HRADNÍ ZŘÍCENINA
        // =========================================================================
        function buildCastleRuinsEnvironment() {
            const envGroup = new THREE.Group();
            scene.add(envGroup);

            const skyCanvas = document.createElement('canvas');
            skyCanvas.width = 32;
            skyCanvas.height = 256;
            const sCtx = skyCanvas.getContext('2d');
            const skyGrad = sCtx.createLinearGradient(0, 0, 0, 256);
            skyGrad.addColorStop(0.0, '#3a6ea5');
            skyGrad.addColorStop(0.45, '#7ba7cc');
            skyGrad.addColorStop(0.75, '#c9d9d2');
            skyGrad.addColorStop(1.0, '#e8d7b5');
            sCtx.fillStyle = skyGrad;
            sCtx.fillRect(0, 0, 32, 256);
            const skyTex = new THREE.CanvasTexture(skyCanvas);
            const skyDome = new THREE.Mesh(
                new THREE.SphereGeometry(85, 24, 16),
                new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false })
            );
            envGroup.add(skyDome);

            const ruinStoneTex = createRuinedStoneTexture();
            ruinStoneTex.repeat.set(2, 2);
            const ruinWallMat = new THREE.MeshStandardMaterial({
                map: ruinStoneTex,
                color: '#9aa09a',
                roughness: 0.92,
                metalness: 0.03
            });

            const mossStoneMat = new THREE.MeshStandardMaterial({
                map: ruinStoneTex,
                color: '#6e8268',
                roughness: 0.94,
                metalness: 0.02
            });

            const grassGroundMat = new THREE.MeshStandardMaterial({
                color: '#3f632b',
                roughness: 0.95
            });

            const mossMat = new THREE.MeshStandardMaterial({
                color: '#2e5720',
                roughness: 0.92
            });

            const barkTex = createBarkTexture();
            barkTex.repeat.set(2, 4);
            const trunkMat = new THREE.MeshStandardMaterial({
                map: barkTex,
                roughness: 0.92
            });

            // 1. Zvlněná louka a zarostlé nádvoří
            const groundGeo = new THREE.CircleGeometry(82, 64);
            const ground = new THREE.Mesh(groundGeo, grassGroundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.02;
            ground.receiveShadow = true;
            envGroup.add(ground);

            // Mechové a hlinité plochy na nádvoří
            const dirtPatchMat = new THREE.MeshStandardMaterial({ color: '#4c4637', roughness: 0.96 });
            [
                [0, 0, 4.4, 3.6, 0.2, mossMat],
                [-2.8, 1.6, 2.5, 1.9, -0.4, dirtPatchMat],
                [3.1, 1.2, 2.7, 2.1, 0.5, mossMat],

            // 2. ZBOŘENÁ STRÁŽNÍ VĚŽ

            // 4. NEPRAVIDELNÉ ROZBOŘENÉ HRADBY
            function buildJaggedRuinWall(startX, startZ, endX, endZ, heightProfile) {
                const steps = heightProfile.length;
                const dx = (endX - startX) / steps;
                const dz = (endZ - startZ) / steps;
                const segLen = Math.hypot(dx, dz) * 1.12;
                const wallAngle = Math.atan2(dz, dx);

                for (let i = 0; i < steps; i++) {
                    const h = heightProfile[i];
                    if (h <= 0.2) continue;

                    const wx = startX + dx * (i + 0.5);
                    const wz = startZ + dz * (i + 0.5);
                    const thick = 1.15 + ((i * 7) % 3) * 0.14;

                    const seg = new THREE.Mesh(
                        new THREE.BoxGeometry(segLen, h, thick),
                        i % 2 === 0 ? ruinWallMat : mossStoneMat
                    );
                    seg.position.set(wx, h / 2 - 0.05, wz);
                    seg.rotation.y = -wallAngle + ((i % 3) - 1) * 0.03;
                    seg.rotation.z = ((i % 3) - 1) * 0.025;
                    seg.castShadow = true;
                    seg.receiveShadow = true;
                    envGroup.add(seg);

                    const capStone = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(0.45 + (i % 3) * 0.12, 0),
                        mossStoneMat
                    );
                    capStone.scale.set(1.2, 0.75, 1.0);
                    capStone.position.set(wx, h - 0.05, wz);
                    capStone.rotation.set(0.2, i * 0.7, 0.15);
                    capStone.castShadow = true;
                    envGroup.add(capStone);
                }
            }

            buildJaggedRuinWall(-12.5, -1.2, -9.8, -7.8, [1.4, 2.3, 3.1, 3.8, 3.4, 4.2]);
            buildJaggedRuinWall(-6.2, -10.8, -2.5, -12.0, [3.2, 2.4, 1.5, 2.1, 2.9]);
            buildJaggedRuinWall(4.8, -11.4, 11.8, -3.5, [2.8, 3.7, 3.1, 1.3, 0.7, 1.9, 3.4, 2.5, 1.4]);

            // 5. HROMADY SPADANÝCH KAMENŮ A SUTIN
            const rubbleCoords = [
                [-5.6, -8.4, 0.95], [-4.8, -7.8, 0.65], [-6.3, -7.2, 0.72],
                [2.8, -10.8, 1.05], [3.6, -10.2, 0.75], [2.1, -10.1, 0.62],

                rock.receiveShadow = true;
                envGroup.add(rock);
            });

            // 6. DETAILNÍ LISTNATÉ KEŘE A POPÍNAVÝ BŘEČŤAN
            const bushPalettes = [
                ['#1e4618', '#2d6122', '#3f7a2c', '#548f35'],
                ['#234d1b', '#336b25', '#478530', '#60993b'],
                ['#1a3d15', '#29571f', '#387028', '#4d8732']
            ];
            const berryMat = new THREE.MeshStandardMaterial({ color: '#dc2626', roughness: 0.35 });

            function createDetailedBush(bx, by, bz, scale, variant = 0) {
                const bushGroup = new THREE.Group();
                bushGroup.position.set(bx, by, bz);
                bushGroup.scale.setScalar(scale);

                const pal = bushPalettes[variant % bushPalettes.length];
                const lobeCount = 16;

                for (let i = 0; i < lobeCount; i++) {
                    const ang = (i / lobeCount) * Math.PI * 2 + (i % 3) * 0.4;
                    const layer = i < 6 ? 0 : (i < 12 ? 1 : 2);
                    const dist = layer === 0 ? 0.52 : (layer === 1 ? 0.34 : 0.14);
                    const ly = layer === 0 ? 0.26 : (layer === 1 ? 0.48 : 0.68);
                    const rad = (0.34 - layer * 0.04) + (i % 3) * 0.06;

                    const lobeMat = new THREE.MeshStandardMaterial({
                        color: pal[(i + variant) % pal.length],
                        roughness: 0.84,
                        flatShading: true
                    });

                    const lobe = new THREE.Mesh(new THREE.IcosahedronGeometry(rad, 0), lobeMat);
                    lobe.position.set(Math.cos(ang) * dist, ly, Math.sin(ang) * dist);
                    lobe.rotation.set(i * 0.7, i * 1.1, i * 0.5);
                    lobe.scale.set(1.15, 0.92, 1.08);
                    lobe.castShadow = true;
                    lobe.receiveShadow = true;
                    bushGroup.add(lobe);

                    if (i % 4 === 0 && layer <= 1) {
                        const berry = new THREE.Mesh(new THREE.SphereGeometry(0.032, 6, 6), berryMat);
                        berry.position.set(
                            Math.cos(ang) * (dist + rad * 0.85),
                            ly + 0.05,
                            Math.sin(ang) * (dist + rad * 0.85)
                        );
                        bushGroup.add(berry);
                    }
                }

                envGroup.add(bushGroup);
            }

            createDetailedBush(-4.7, 0, -4.1, 1.15, 0);
            createDetailedBush(4.9, 0, -4.4, 1.25, 1);
            createDetailedBush(-7.6, 0, -5.6, 1.35, 2);
            createDetailedBush(7.8, 0, -5.2, 1.30, 0);

            createDetailedBush(-6.6, 3.8, -8.3, 0.85, 2);
            createDetailedBush(-7.2, 2.2, -7.5, 0.95, 0);
            createDetailedBush(-1.9, 3.6, -11.6, 0.80, 1);
            createDetailedBush(6.2, 2.5, -7.9, 0.90, 2);

            // 7. REALISTICKÉ LISTNATÉ STROMY
            const treeFoliagePalette = ['#1d4717', '#2b5e20', '#3d7729', '#528d34', '#639b3d'];

            function createRealisticTree(tx, tz, scale, seed = 0) {
                const tree = new THREE.Group();
                tree.position.set(tx, 0, tz);
                tree.scale.setScalar(scale);

                const trunkH = 3.8;
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.24, 0.46, trunkH, 10),
                    trunkMat
                );
                trunk.position.y = trunkH / 2;
                trunk.rotation.z = ((seed % 3) - 1) * 0.04;
                trunk.castShadow = true;
                trunk.receiveShadow = true;
                tree.add(trunk);

                for (let r = 0; r < 4; r++) {
                    const rAng = (r / 4) * Math.PI * 2 + seed * 0.5;
                    const root = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.22, 0.95, 6), trunkMat);
                    root.position.set(Math.cos(rAng) * 0.36, 0.28, Math.sin(rAng) * 0.36);
                    root.rotation.z = -Math.cos(rAng) * 0.65;
                    root.rotation.x = Math.sin(rAng) * 0.65;
                    tree.add(root);
                }

                const branchConfigs = [
                    [0.35, 3.2, 0.2, 0.52, 0.3],
                    [-0.4, 3.4, -0.25, -0.58, -0.35],
                    [0.15, 3.5, -0.35, 0.2, -0.55],
                    [-0.2, 3.3, 0.38, -0.25, 0.52]
                ];
                branchConfigs.forEach(([bx, by, bz, rz, rx]) => {
                    const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.18, 1.8, 7), trunkMat);
                    branch.position.set(bx, by, bz);
                    branch.rotation.set(rx, 0, rz);
                    branch.castShadow = true;
                    tree.add(branch);
                });

                const canopyClusters = [
                    [0, 5.4, 0, 1.55],
                    [-1.15, 4.7, 0.65, 1.25],
                    [1.2, 4.8, 0.55, 1.28],
                    [0.2, 4.6, -1.18, 1.22],
                    [-0.35, 4.5, 1.15, 1.18],
                    [-0.95, 5.5, -0.75, 1.15],
                    [1.05, 5.6, -0.65, 1.18],
                    [0.85, 5.4, 0.95, 1.12],
                    [-0.85, 5.3, 0.92, 1.15],
                    [0, 6.3, 0.15, 1.25],
                    [-0.65, 6.1, -0.35, 1.02],
                    [0.7, 6.0, 0.35, 1.05],
                    [-1.55, 4.3, -0.25, 0.95],
                    [1.52, 4.35, -0.15, 0.98]
                ];

                canopyClusters.forEach(([cx, cy, cz, cr], idx) => {
                    const cMat = new THREE.MeshStandardMaterial({
                        color: treeFoliagePalette[(idx + seed) % treeFoliagePalette.length],
                        roughness: 0.85,
                        flatShading: true
                    });
                    const cluster = new THREE.Mesh(new THREE.IcosahedronGeometry(cr, 1), cMat);
                    cluster.position.set(cx, cy, cz);
                    cluster.rotation.set(idx * 0.6, seed + idx * 0.9, idx * 0.4);
                    cluster.scale.set(1.12, 0.88, 1.08);
                    cluster.castShadow = true;
                    cluster.receiveShadow = true;
                    tree.add(cluster);
                });

                envGroup.add(tree);
            }

            [
                [-14.5, -13.5, 1.18, 0],
                [-10.2, -16.8, 1.32, 1],
                [-3.8, -17.5, 1.25, 2],
                [3.6, -16.8, 1.30, 3],
                [10.8, -15.5, 1.22, 4],
                [15.5, -11.5, 1.35, 1],
                [-16.2, -5.8, 1.15, 2],
                [16.0, -4.8, 1.20, 0],
                [-13.8, 2.5, 1.08, 3],
                [14.2, 3.2, 1.12, 4]
            ].forEach(([tx, tz, sc, sd]) => createRealisticTree(tx, tz, sc, sd));

            // 8. KAPRADINY, TRSY TRÁVY A LUČNÍ KVÍTÍ
            const frondMat = new THREE.MeshStandardMaterial({
                color: '#387624',
                roughness: 0.8,
                side: THREE.DoubleSide
            });
            const frondGeo = new THREE.ConeGeometry(0.14, 0.72, 3);
            frondGeo.translate(0, 0.36, 0);

            [
                [-3.9, -3.4], [4.1, -3.6], [-5.4, -6.5], [5.5, -6.2],
                [-2.9, -8.8], [3.1, -8.6], [-6.8, -2.5], [7.1, -2.4],
                [-4.2, 2.3], [4.4, 2.1], [-1.9, -6.8], [2.2, -6.5]
            ].forEach(([fx, fz], fIdx) => {
                const fern = new THREE.Group();
                fern.position.set(fx, 0, fz);
                const fronds = 7;
                for (let k = 0; k < fronds; k++) {
                    const ang = (k / fronds) * Math.PI * 2 + fIdx;
                    const frond = new THREE.Mesh(frondGeo, frondMat);
                    frond.rotation.y = ang;
                    frond.rotation.x = 0.85 + (k % 2) * 0.22;
                    fern.add(frond);
                }
                envGroup.add(fern);
            });

            const bladeCount = 650;
            const bladeGeo = new THREE.ConeGeometry(0.035, 0.34, 3);
            bladeGeo.translate(0, 0.17, 0);
            const bladeMat = new THREE.MeshStandardMaterial({ color: '#4a7c2c', roughness: 0.88 });
            const grassInst = new THREE.InstancedMesh(bladeGeo, bladeMat, bladeCount);
            const dummy = new THREE.Object3D();

            let placed = 0;
            let attempt = 0;
            while (placed < bladeCount && attempt < 2500) {
                attempt++;
                const r = 2.1 + Math.sqrt((attempt * 73) % 100 / 100) * 12.5;
                const theta = attempt * 2.39996;
                const gx = Math.cos(theta) * r;
                const gz = Math.sin(theta) * r;

                if (Math.abs(gx) < 2.25 && Math.abs(gz) < 1.55) continue;

                dummy.position.set(gx, -0.01, gz);
                dummy.rotation.set(
                    Math.sin(attempt) * 0.25,
                    attempt * 1.3,
                    Math.cos(attempt) * 0.25
                );
                const hScale = 0.65 + (attempt % 5) * 0.22;
                dummy.scale.set(1, hScale, 1);
                dummy.updateMatrix();
                grassInst.setMatrixAt(placed, dummy.matrix);
                placed++;
            }
            grassInst.count = placed;
            grassInst.instanceMatrix.needsUpdate = true;
            envGroup.add(grassInst);

            const flowerColors = ['#facc15', '#ffffff', '#60a5fa', '#f43f5e', '#fde047'];
            const flowerGeo = new THREE.DodecahedronGeometry(0.055, 0);
            for (let fl = 0; fl < 95; fl++) {
                const fr = 2.6 + ((fl * 37) % 100) / 100 * 10.5;
                const fa = fl * 2.39996 + 0.5;
                const fx = Math.cos(fa) * fr;
                const fz = Math.sin(fa) * fr;
                if (Math.abs(fx) < 2.4 && Math.abs(fz) < 1.7) continue;

                const fMat = new THREE.MeshStandardMaterial({
                    color: flowerColors[fl % flowerColors.length],
                    roughness: 0.6
                });
                const flower = new THREE.Mesh(flowerGeo, fMat);
                flower.scale.set(1.2, 0.45, 1.2);
                flower.position.set(fx, 0.16 + (fl % 3) * 0.05, fz);
                envGroup.add(flower);
            }
        }

        // =========================================================================
        // 4C. 3D MODEL TRUHLY A KLENUTÉHO VÍKA
        // =========================================================================
        function buildChestAndLock(woodMat, darkInnerMat, goldMat, brassDarkMat, ironDarkMat) {
            chestRoot = new THREE.Group();
            chestRoot.rotation.y = currentChestRotY;
            scene.add(chestRoot);

            const baseGroup = new THREE.Group();
            chestRoot.add(baseGroup);

            function addInteractiveWood(mesh) {
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                baseGroup.add(mesh);
                interactiveTargets.push(mesh);
            }

            // Dno a 4 stěny spodní bedny
            const bottomMesh = new THREE.Mesh(new THREE.BoxGeometry(W, wallT, D), woodMat);
            bottomMesh.position.set(0, wallT / 2, 0);
            addInteractiveWood(bottomMesh);

            const innerFloor = new THREE.Mesh(new THREE.BoxGeometry(W - wallT * 2, 0.02, D - wallT * 2), darkInnerMat);
            innerFloor.position.set(0, wallT + 0.01, 0);
            baseGroup.add(innerFloor);

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(W, H - wallT, wallT), woodMat);
            frontWall.position.set(0, (H + wallT) / 2, D / 2 - wallT / 2);
            addInteractiveWood(frontWall);

            const backWall = new THREE.Mesh(new THREE.BoxGeometry(W, H - wallT, wallT), woodMat);
            backWall.position.set(0, (H + wallT) / 2, -D / 2 + wallT / 2);
            addInteractiveWood(backWall);

            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallT, H - wallT, D - wallT * 2), woodMat);
            leftWall.position.set(-W / 2 + wallT / 2, (H + wallT) / 2, 0);
            addInteractiveWood(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallT, H - wallT, D - wallT * 2), woodMat);
            rightWall.position.set(W / 2 - wallT / 2, (H + wallT) / 2, 0);
            addInteractiveWood(rightWall);

            // Horní a spodní obvodový zlatý rám spodní bedny
            const rimThick = 0.04;
            const rimH = 0.11;
            [rimH / 2, H - rimH / 2].forEach((ry) => {
                const fRim = new THREE.Mesh(new THREE.BoxGeometry(W + rimThick * 2, rimH, rimThick), goldMat);
                fRim.position.set(0, ry, D / 2 + rimThick / 2);
                fRim.castShadow = true;
                baseGroup.add(fRim);

                const bRim = new THREE.Mesh(new THREE.BoxGeometry(W + rimThick * 2, rimH, rimThick), goldMat);
                bRim.position.set(0, ry, -D / 2 - rimThick / 2);
                bRim.castShadow = true;
                baseGroup.add(bRim);

                const lRim = new THREE.Mesh(new THREE.BoxGeometry(rimThick, rimH, D), goldMat);
                lRim.position.set(-W / 2 - rimThick / 2, ry, 0);
                lRim.castShadow = true;
                baseGroup.add(lRim);

                const rRim = new THREE.Mesh(new THREE.BoxGeometry(rimThick, rimH, D), goldMat);
                rRim.position.set(W / 2 + rimThick / 2, ry, 0);
                rRim.castShadow = true;
                baseGroup.add(rRim);
            });

            // Svislé zlaté pásy se cvočky
            const strapPositionsX = [-1.52, -1.24, 1.24, 1.52];
            const rivetGeo = new THREE.SphereGeometry(0.032, 10, 10);

            strapPositionsX.forEach((sx) => {
                const fStrap = new THREE.Mesh(new THREE.BoxGeometry(0.14, H, 0.045), goldMat);
                fStrap.position.set(sx, H / 2, D / 2 + 0.022);
                fStrap.castShadow = true;
                baseGroup.add(fStrap);

                const bStrap = new THREE.Mesh(new THREE.BoxGeometry(0.14, H, 0.045), goldMat);
                bStrap.position.set(sx, H / 2, -D / 2 - 0.022);
                bStrap.castShadow = true;
                baseGroup.add(bStrap);

                [0.28, 0.72, 1.16].forEach((ry) => {
                    const rFront = new THREE.Mesh(rivetGeo, goldMat);
                    rFront.position.set(sx, ry, D / 2 + 0.045);
                    baseGroup.add(rFront);

                    const rBack = new THREE.Mesh(rivetGeo, goldMat);
                    rBack.position.set(sx, ry, -D / 2 - 0.045);
                    baseGroup.add(rBack);
                });
            });

            // 8 rohových úhelníků z tmavé mosazi
            const cornerSize = 0.24;
            [-1, 1].forEach((sx) => {
                [-1, 1].forEach((sz) => {
                    [cornerSize / 2, H - cornerSize / 2].forEach((cy) => {
                        const corner = new THREE.Mesh(
                            new THREE.BoxGeometry(cornerSize, cornerSize, cornerSize),
                            brassDarkMat
                        );
                        corner.position.set(
                            sx * (W / 2 - cornerSize / 2 + 0.045),
                            cy,
                            sz * (D / 2 - cornerSize / 2 + 0.045)
                        );
                        corner.castShadow = true;
                        baseGroup.add(corner);
                    });
                });
            });

            // Boční kruhová madla
            [-1, 1].forEach((side) => {
                const mount = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.06, 16), brassDarkMat);
                mount.rotation.z = Math.PI / 2;
                mount.position.set(side * (W / 2 + 0.03), H * 0.52, 0);
                baseGroup.add(mount);

                const ring = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.032, 12, 24), goldMat);
                ring.rotation.y = Math.PI / 2;
                ring.rotation.x = side * 0.18;
                ring.position.set(side * (W / 2 + 0.08), H * 0.42, 0);
                ring.castShadow = true;
                baseGroup.add(ring);
            });

            // Zadní panty
            [-1.1, 1.1].forEach((hx) => {
                const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.28, 12), brassDarkMat);
                hinge.rotation.z = Math.PI / 2;
                hinge.position.set(hx, H, -D / 2 - 0.03);
                baseGroup.add(hinge);
            });

            // Klenuté víko otočné kolem zadní horní hrany bedny
            lidPivot = new THREE.Group();
            lidPivot.position.set(0, H, -D / 2);
            chestRoot.add(lidPivot);

            const R_out = D / 2;
            const R_in = D / 2 - wallT;

            // Dutý klenutý plášť víka
            const archShape = new THREE.Shape();
            archShape.absarc(0, 0, R_out, 0, Math.PI, false);
            archShape.absarc(0, 0, R_in, Math.PI, 0, true);
            archShape.closePath();

            const lidShellGeo = new THREE.ExtrudeGeometry(archShape, {
                depth: W,
                bevelEnabled: false,
                curveSegments: 32
            });
            lidShellGeo.rotateY(Math.PI / 2);
            lidShellGeo.translate(-W / 2, 0, D / 2);

            const lidShell = new THREE.Mesh(lidShellGeo, woodMat);
            lidShell.castShadow = true;
            lidShell.receiveShadow = true;
            lidPivot.add(lidShell);
            interactiveTargets.push(lidShell);

            // Půlkruhové bočnice víka
            const capShape = new THREE.Shape();
            capShape.absarc(0, 0, R_out - 0.01, 0, Math.PI, false);
            capShape.closePath();
            const capGeo = new THREE.ShapeGeometry(capShape, 32);
            capGeo.rotateY(Math.PI / 2);

            const leftCap = new THREE.Mesh(capGeo, woodMat);
            leftCap.position.set(-W / 2 + 0.02, 0, D / 2);
            leftCap.castShadow = true;
            lidPivot.add(leftCap);
            interactiveTargets.push(leftCap);

            const rightCap = new THREE.Mesh(capGeo, woodMat);
            rightCap.position.set(W / 2 - 0.02, 0, D / 2);
            rightCap.castShadow = true;
            lidPivot.add(rightCap);
            interactiveTargets.push(rightCap);

            // Spodní zlatý obvodový lem víka
            const lidFrontRim = new THREE.Mesh(new THREE.BoxGeometry(W + 0.08, 0.09, 0.045), goldMat);
            lidFrontRim.position.set(0, 0.045, D + 0.02);
            lidPivot.add(lidFrontRim);

            const lidBackRim = new THREE.Mesh(new THREE.BoxGeometry(W + 0.08, 0.09, 0.045), goldMat);
            lidBackRim.position.set(0, 0.045, -0.02);
            lidPivot.add(lidBackRim);

            [-1, 1].forEach((side) => {
                const sideRim = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.09, D + 0.04), goldMat);
                sideRim.position.set(side * (W / 2 + 0.02), 0.045, D / 2);
                lidPivot.add(sideRim);
            });

            // 6 klenutých zlatých obručí přes oblouk víka
            const strapArcShape = new THREE.Shape();
            strapArcShape.absarc(0, 0, R_out + 0.032, 0, Math.PI, false);
            strapArcShape.absarc(0, 0, R_out - 0.005, Math.PI, 0, true);
            strapArcShape.closePath();

            const strapArcGeo = new THREE.ExtrudeGeometry(strapArcShape, {
                depth: 0.14,
                bevelEnabled: false,
                curveSegments: 32
            });
            strapArcGeo.rotateY(Math.PI / 2);
            strapArcGeo.translate(-0.07, 0, D / 2);

            const lidStrapX = [-1.72, -1.52, -1.24, 1.24, 1.52, 1.72];
            lidStrapX.forEach((lx) => {
                const archStrap = new THREE.Mesh(strapArcGeo, goldMat);
                archStrap.position.x = lx;
                archStrap.castShadow = true;
                lidPivot.add(archStrap);

                [0.25, 0.5, 0.75].forEach((t) => {
                    const ang = t * Math.PI;
                    const rvt = new THREE.Mesh(rivetGeo, goldMat);
                    rvt.position.set(
                        lx,
                        Math.sin(ang) * (R_out + 0.035),
                        D / 2 + Math.cos(ang) * (R_out + 0.035)
                    );
                    lidPivot.add(rvt);
                });
            });

            // Mechanický 8-ciferný zámek
            buildMechanicalCombinationLock(baseGroup, lidPivot, goldMat, brassDarkMat, ironDarkMat);
        }

        function buildMechanicalCombinationLock(baseGroup, lidPivot, goldMat, brassDarkMat, ironDarkMat) {
            const lockGroup = new THREE.Group();
            lockGroup.position.set(0, H - 0.04, D / 2 + 0.045);
            baseGroup.add(lockGroup);

            const plateW = 2.34;
            const plateH = 0.72;
            const plateD = 0.06;

            const housingDarkMat = new THREE.MeshStandardMaterial({
                color: '#2c1f14',
                metalness: 0.68,
                roughness: 0.45
            });

            const pointerCrimsonMat = new THREE.MeshStandardMaterial({
                color: '#dc2626',
                emissive: '#7f1d1d',
                emissiveIntensity: 0.35,
                roughness: 0.35
            });

            const backPlate = new THREE.Mesh(new THREE.BoxGeometry(plateW, plateH, plateD), housingDarkMat);
            backPlate.castShadow = true;
            lockGroup.add(backPlate);
            interactiveTargets.push(backPlate);

            const winW = 1.88;
            const winH = 0.42;
            const frameT = 0.05;

            const topBar = new THREE.Mesh(new THREE.BoxGeometry(plateW + 0.04, 0.15, frameT), housingDarkMat);
            topBar.position.set(0, (plateH + winH) / 4, plateD / 2 + frameT / 2);
            lockGroup.add(topBar);

            const botBar = new THREE.Mesh(new THREE.BoxGeometry(plateW + 0.04, 0.15, frameT), housingDarkMat);
            botBar.position.set(0, -(plateH + winH) / 4, plateD / 2 + frameT / 2);
            lockGroup.add(botBar);

            const leftBar = new THREE.Mesh(new THREE.BoxGeometry((plateW - winW) / 2 + 0.02, winH, frameT), housingDarkMat);
            leftBar.position.set(-(plateW + winW) / 4, 0, plateD / 2 + frameT / 2);
            lockGroup.add(leftBar);

            const rightBar = new THREE.Mesh(new THREE.BoxGeometry((plateW - winW) / 2 + 0.02, winH, frameT), housingDarkMat);
            rightBar.position.set((plateW + winW) / 4, 0, plateD / 2 + frameT / 2);
            lockGroup.add(rightBar);

            const outerGoldTop = new THREE.Mesh(new THREE.BoxGeometry(plateW + 0.08, 0.028, frameT + 0.015), goldMat);
            outerGoldTop.position.set(0, plateH / 2 + 0.01, plateD / 2 + frameT / 2);
            lockGroup.add(outerGoldTop);

            const outerGoldBot = new THREE.Mesh(new THREE.BoxGeometry(plateW + 0.08, 0.028, frameT + 0.015), goldMat);
            outerGoldBot.position.set(0, -plateH / 2 - 0.01, plateD / 2 + frameT / 2);
            lockGroup.add(outerGoldBot);

            const recess = new THREE.Mesh(new THREE.BoxGeometry(winW, winH, 0.02), ironDarkMat);
            recess.position.set(0, 0, plateD / 2 + 0.005);
            lockGroup.add(recess);

            const axle = new THREE.Mesh(
                new THREE.CylinderGeometry(0.03, 0.03, winW + 0.12, 16),
                ironDarkMat
            );
            axle.rotation.z = Math.PI / 2;
            axle.position.set(0, 0, plateD / 2 + 0.03);
            lockGroup.add(axle);

            const lockRivetGeo = new THREE.SphereGeometry(0.024, 10, 10);
            [-1.06, 1.06].forEach((rx) => {
                [-0.27, 0.27].forEach((ry) => {
                    const rvt = new THREE.Mesh(lockRivetGeo, goldMat);
                    rvt.position.set(rx, ry, plateD / 2 + frameT + 0.005);
                    lockGroup.add(rvt);
                });

                const sideRing = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.014, 10, 20), goldMat);
                sideRing.position.set(rx, 0, plateD / 2 + frameT + 0.01);
                lockGroup.add(sideRing);
            });

            const dialTex = createDialNumberTexture();
            const dialMat = new THREE.MeshStandardMaterial({
                color: '#ffffff',
                map: dialTex,
                emissive: '#4a3812',
                emissiveMap: dialTex,
                emissiveIntensity: 0.30,
                roughness: 0.72,
                metalness: 0.08
            });

            const dialR = 0.20;
            const dialW = 0.18;
            const dialSpacing = 0.225;
            const startX = -((DIAL_COUNT - 1) * dialSpacing) / 2;

            dialPivots = [];
            dialMeshes = [];

            const pointerGeo = new THREE.ConeGeometry(0.03, 0.055, 3);

            for (let i = 0; i < DIAL_COUNT; i++) {
                const dx = startX + i * dialSpacing;

                const topPtr = new THREE.Mesh(pointerGeo, pointerCrimsonMat);
                topPtr.rotation.z = Math.PI;
                topPtr.position.set(dx, winH / 2 + 0.052, plateD / 2 + frameT + 0.012);
                lockGroup.add(topPtr);

                const botPtr = new THREE.Mesh(pointerGeo, pointerCrimsonMat);
                botPtr.position.set(dx, -winH / 2 - 0.052, plateD / 2 + frameT + 0.012);
                lockGroup.add(botPtr);

                if (i < DIAL_COUNT - 1) {
                    const sep = new THREE.Mesh(new THREE.BoxGeometry(0.018, winH, frameT * 0.95), housingDarkMat);
                    sep.position.set(dx + dialSpacing / 2, 0, plateD / 2 + frameT / 2);
                    lockGroup.add(sep);
                }

                const pivot = new THREE.Group();
                pivot.position.set(dx, 0, plateD / 2 + 0.02);
                lockGroup.add(pivot);

                const cylGeo = new THREE.CylinderGeometry(dialR, dialR, dialW, 36, 1, false);
                const cylMesh = new THREE.Mesh(cylGeo, dialMat);
                cylMesh.rotation.z = Math.PI / 2;
                cylMesh.castShadow = true;
                cylMesh.userData = { dialIndex: i };
                pivot.add(cylMesh);

                dialPivots.push(pivot);
                dialMeshes.push(cylMesh);
                interactiveTargets.push(cylMesh);
            }

            latchSlider = new THREE.Group();
            latchSlider.position.set(0, 0.06, D + 0.045);
            lidPivot.add(latchSlider);

            const haspPlate = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.24, 0.055), goldMat);
            haspPlate.position.set(0, 0.08, 0);
            haspPlate.castShadow = true;
            latchSlider.add(haspPlate);

            const haspTongue = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.22, 0.065), housingDarkMat);
            haspTongue.position.set(0, -0.08, 0.01);
            latchSlider.add(haspTongue);
        }

        // 4D. BOHATÝ POKLAD UVNITŘ TRUHLY
        // =========================================================================
        function buildTreasure(goldMat) {
            treasureGroup = new THREE.Group();
            treasureGroup.visible = false;
            chestRoot.add(treasureGroup);

            treasureLight = new THREE.PointLight('#fbbf24', 0, 7.5);
            treasureLight.position.set(0, H + 0.55, 0);
            treasureGroup.add(treasureLight);

            // Základní zlatá kupa
            const moundGeo = new THREE.SphereGeometry(1, 28, 18);
            const mound = new THREE.Mesh(moundGeo, goldMat);
            mound.scale.set(1.55, 0.42, 0.85);
            mound.position.set(0, H - 0.16, 0);
            treasureGroup.add(mound);

            // 270 jednotlivých 3D zlatých mincí (InstancedMesh)
            const coinCount = 270;
            const coinGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.028, 16);
            const coinInst = new THREE.InstancedMesh(coinGeo, goldMat, coinCount);
            const dummy = new THREE.Object3D();

            for (let i = 0; i < coinCount; i++) {
                const angle = i * 2.39996;
                const radiusFactor = Math.sqrt((i + 1) / coinCount);
                const cx = Math.cos(angle) * radiusFactor * 1.48;
                const cz = Math.sin(angle) * radiusFactor * 0.78;
                const domeY = Math.sqrt(Math.max(0, 1 - radiusFactor * radiusFactor)) * 0.36;

                dummy.position.set(cx, H - 0.06 + domeY + (i % 3) * 0.015, cz);
                dummy.rotation.set(
                    Math.sin(i * 1.7) * 0.35,
                    i * 0.9,
                    Math.cos(i * 1.3) * 0.35
                );
                const sc = 0.85 + (i % 4) * 0.1;
                dummy.scale.set(sc, 1, sc);
                dummy.updateMatrix();
                coinInst.setMatrixAt(i, dummy.matrix);
            }
            coinInst.instanceMatrix.needsUpdate = true;
            treasureGroup.add(coinInst);

            // 4 zlaté cihly
            const ingotGeo = new THREE.BoxGeometry(0.46, 0.14, 0.22);
            [
                [-0.85, H + 0.14, 0.25, 0.35, 0.12],
                [0.88, H + 0.12, 0.28, -0.42, -0.1],
                [-0.72, H + 0.16, -0.26, -0.25, 0.08],
                [0.76, H + 0.15, -0.24, 0.28, -0.12]
            ].forEach(([ix, iy, iz, ry, rz]) => {
                const ingot = new THREE.Mesh(ingotGeo, goldMat);
                ingot.position.set(ix, iy, iz);
                ingot.rotation.set(0.08, ry, rz);
                ingot.castShadow = true;
                treasureGroup.add(ingot);
            });

            // Královská koruna uprostřed
            const crownGroup = new THREE.Group();
            crownGroup.position.set(0, H + 0.28, 0.02);
            crownGroup.rotation.set(0.14, 0.22, -0.06);
            treasureGroup.add(crownGroup);

            const crownRing = new THREE.Mesh(
                new THREE.CylinderGeometry(0.36, 0.32, 0.16, 24, 1, true),
                goldMat
            );
            crownGroup.add(crownRing);

            const velvetMat = new THREE.MeshStandardMaterial({ color: '#7f1d1d', roughness: 0.85 });
            const velvetCap = new THREE.Mesh(new THREE.SphereGeometry(0.31, 18, 12), velvetMat);
            velvetCap.scale.set(1, 0.65, 1);
            velvetCap.position.y = 0.06;
            crownGroup.add(velvetCap);

            const pearlMat = new THREE.MeshStandardMaterial({ color: '#fffbeb', roughness: 0.25, metalness: 0.1 });
            const spikeCount = 8;
            for (let s = 0; s < spikeCount; s++) {
                const sa = (s / spikeCount) * Math.PI * 2;
                const spike = new THREE.Mesh(new THREE.ConeGeometry(0.065, 0.22, 6), goldMat);
                spike.position.set(Math.cos(sa) * 0.34, 0.17, Math.sin(sa) * 0.34);
                crownGroup.add(spike);

                const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.032, 10, 10), pearlMat);
                pearl.position.set(Math.cos(sa) * 0.34, 0.29, Math.sin(sa) * 0.34);
                crownGroup.add(pearl);
            }

            // Královské jablko s křížkem na vrcholu koruny
            const orb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), goldMat);
            orb.position.y = 0.29;
            crownGroup.add(orb);

            const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.11, 0.02), goldMat);
            crossV.position.y = 0.37;
            crownGroup.add(crossV);

            const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.02, 0.02), goldMat);
            crossH.position.y = 0.38;
            crownGroup.add(crossH);

            // 18 broušených barevných drahokamů
            const gemColors = ['#ef4444', '#3b82f6', '#10b981', '#a855f7', '#f59e0b', '#06b6d4', '#ec4899', '#e0f2fe'];
            const gemGeos = [
                new THREE.OctahedronGeometry(0.095, 0),
                new THREE.DodecahedronGeometry(0.085, 0)
            ];

            for (let g = 0; g < 18; g++) {
                const ga = g * 2.39996 + 0.4;
                const gr = 0.42 + ((g * 37) % 100) / 100 * 0.92;
                const gx = Math.cos(ga) * gr;
                const gz = Math.sin(ga) * gr * 0.55;
                const gy = H + 0.18 + (1 - gr / 1.4) * 0.18;

                const gMat = new THREE.MeshStandardMaterial({
                    color: gemColors[g % gemColors.length],
                    emissive: gemColors[g % gemColors.length],
                    emissiveIntensity: 0.28,
                    roughness: 0.15,
                    metalness: 0.2
                });

                const gem = new THREE.Mesh(gemGeos[g % gemGeos.length], gMat);
                gem.position.set(gx, gy, gz);
                gem.rotation.set(g * 0.7, g * 1.2, g * 0.4);
                gem.scale.set(1.1, 0.85, 1.1);
                treasureGroup.add(gem);
            }
        }

        function buildAmbientParticles3D() {
            const count = 90;
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 18;
                positions[i * 3 + 1] = 0.6 + Math.random() * 6.5;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 16;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: '#fef08a',
                size: 0.08,
                transparent: true,
                opacity: 0.55
            });
            dustPoints3D = new THREE.Points(geo, mat);
            scene.add(dustPoints3D);
        }

        // =========================================================================
        // 5. OVLÁDACÍ PANEL BUBÍNKŮ A LOGIKA ODEMČENÍ
        // =========================================================================
        function buildDialControlButtons() {
            dialButtonsRow.innerHTML = '';
            for (let i = 0; i < DIAL_COUNT; i++) {
                const col = document.createElement('div');
                col.className = 'flex flex-col items-center gap-1';

                const upBtn = document.createElement('button');
                upBtn.type = 'button';
                upBtn.textContent = '▲';
                upBtn.className = 'w-8 h-7 sm:w-10 sm:h-8 rounded-lg bg-slate-800/90 hover:bg-amber-500 hover:text-slate-950 text-amber-300 font-bold text-[11px] sm:text-xs border border-amber-500/30 active:scale-90 transition cursor-pointer';
                upBtn.onclick = () => rotateDial(i, 1);

                const badge = document.createElement('div');
                badge.id = `dial-badge-${i}`;
                badge.textContent = '0';
                badge.className = 'w-8 h-8 sm:w-10 sm:h-9 rounded-lg bg-amber-950/80 border border-amber-400/50 flex items-center justify-center font-fantasy font-bold text-base sm:text-lg text-amber-200 shadow-inner';

                const downBtn = document.createElement('button');
                downBtn.type = 'button';
                downBtn.textContent = '▼';
                downBtn.className = 'w-8 h-7 sm:w-10 sm:h-8 rounded-lg bg-slate-800/90 hover:bg-amber-500 hover:text-slate-950 text-amber-300 font-bold text-[11px] sm:text-xs border border-amber-500/30 active:scale-90 transition cursor-pointer';
                downBtn.onclick = () => rotateDial(i, -1);

                col.appendChild(upBtn);
                col.appendChild(badge);
                col.appendChild(downBtn);
                dialButtonsRow.appendChild(col);
            }
        }

        function rotateDial(index, delta) {
            if (appPhase !== 'ZOOMED') return;

            dialValues[index] = (dialValues[index] + delta + 10) % 10;
            dialVisualSteps[index] += delta;

            const badge = document.getElementById(`dial-badge-${index}`);
            if (badge) {
                badge.textContent = String(dialValues[index]);
            }

            playDialClick(delta);
            checkCombination();
        }

        function checkCombination() {
            const isMatch = dialValues.every((val, idx) => val === SECRET_COMBINATION[idx]);
            if (isMatch && appPhase === 'ZOOMED') {
                appPhase = 'UNLOCKING';
                statusText.textContent = 'Správný kód! Zámek povoluje...';

                clearTimeout(unlockTimeout);
                unlockTimeout = setTimeout(() => {
                    triggerUnlockSequence();
                }, 360);
            }
        }

        function triggerUnlockSequence() {
            appPhase = 'OPEN';
            document.body.classList.add('chest-open');

            playLatchReleaseSound();
            setTimeout(() => playVictoryFanfare(), 220);

            statusText.textContent = 'Truhla je otevřená!';
            treasureGroup.visible = true;

            dialControlsBar.classList.add('translate-y-8', 'opacity-0', 'pointer-events-none');
            victoryPanel.classList.remove('translate-y-8', 'opacity-0', 'pointer-events-none');
            resetBtn.classList.remove('translate-y-8', 'opacity-0', 'pointer-events-none');

            camTargetPos.copy(CAM_OPEN.pos);
            camTargetLook.copy(CAM_OPEN.look);
            targetChestRotY = -0.28;

            clearInterval(sparkleInterval);
            sparkleInterval = setInterval(spawnTreasureSparkle, 130);
        }

        function resetChest() {
            clearTimeout(unlockTimeout);
            clearInterval(sparkleInterval);

            appPhase = 'IDLE';
            document.body.classList.remove('chest-open');

            dialValues = new Array(DIAL_COUNT).fill(0);
            dialVisualSteps = new Array(DIAL_COUNT).fill(0);
            for (let i = 0; i < DIAL_COUNT; i++) {
                const badge = document.getElementById(`dial-badge-${i}`);
                if (badge) badge.textContent = '0';
            }

            victoryPanel.classList.add('translate-y-8', 'opacity-0', 'pointer-events-none');
            resetBtn.classList.add('translate-y-8', 'opacity-0', 'pointer-events-none');
            dialControlsBar.classList.add('translate-y-8', 'opacity-0', 'pointer-events-none');

            camTargetPos.copy(CAM_IDLE.pos);
            camTargetLook.copy(CAM_IDLE.look);
            targetChestRotY = -0.35;

            statusText.textContent = 'Klikni na truhlu';

            setTimeout(() => {
                if (appPhase === 'IDLE') {
                    treasureGroup.visible = false;
                }
            }, 650);
        }

        function zoomToLock() {
            if (appPhase !== 'IDLE') return;
            ensureAudioContext();

            appPhase = 'ZOOMED';
            camTargetPos.copy(CAM_ZOOM.pos);
            camTargetLook.copy(CAM_ZOOM.look);
            targetChestRotY = 0;

            statusText.textContent = 'Zadej osmiciferný kód zámku';
            dialControlsBar.classList.remove('translate-y-8', 'opacity-0', 'pointer-events-none');
        }

        // =========================================================================
        // 6. VIZUÁLNÍ EFEKTY ČÁSTIC (DOM) A INTERAKCE MYŠÍ / DOTYKEM
        // =========================================================================
        function createAmbientDustDOM() {
            ambientDustLayer.innerHTML = '';
            for (let i = 0; i < 24; i++) {
                const dot = document.createElement('div');
                dot.className = 'ambient-dust';
                const size = 2 + Math.random() * 4;
                dot.style.width = `${size}px`;
                dot.style.height = `${size}px`;
                dot.style.left = `${Math.random() * 100}vw`;
                dot.style.top = `${20 + Math.random() * 75}vh`;
                dot.style.animationDuration = `${6 + Math.random() * 8}s`;
                dot.style.animationDelay = `${-Math.random() * 8}s`;
                ambientDustLayer.appendChild(dot);
            }
        }

        function spawnTreasureSparkle() {
            if (appPhase !== 'OPEN') return;
            const sp = document.createElement('div');
            sp.className = 'treasure-sparkle';
            const size = 4 + Math.random() * 7;
            sp.style.width = `${size}px`;
            sp.style.height = `${size}px`;
            sp.style.left = `${42 + Math.random() * 16}vw`;
            sp.style.top = `${45 + Math.random() * 8}vh`;
            sparklesLayer.appendChild(sp);

            setTimeout(() => {
                if (sp.parentNode) sp.parentNode.removeChild(sp);
            }, 2150);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.render(scene, camera);
        }

        function getRaycastHit(clientX, clientY) {
            mouseNDC.x = (clientX / window.innerWidth) * 2 - 1;
            mouseNDC.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouseNDC, camera);
            const hits = raycaster.intersectObjects(interactiveTargets, false);
            return hits.length > 0 ? hits[0] : null;
        }

        function setupPointerAndWheelEvents() {
            let isDragging = false;
            let dragStartX = 0;
            let dragStartY = 0;
            let startRotY = 0;
            let movedDistance = 0;

            canvas.addEventListener('pointerdown', (e) => {
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                startRotY = targetChestRotY;
                movedDistance = 0;
            });

            window.addEventListener('pointermove', (e) => {
                if (isDragging) {
                    const dx = e.clientX - dragStartX;
                    const dy = e.clientY - dragStartY;
                    movedDistance = Math.hypot(dx, dy);

                    if (movedDistance > 6 && appPhase !== 'ZOOMED') {
                        targetChestRotY = startRotY + dx * 0.008;
                    }
                } else {
                    const hit = getRaycastHit(e.clientX, e.clientY);
                    canvas.style.cursor = hit ? 'pointer' : 'default';
                }
            });

            window.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;

                if (movedDistance < 8) {
                    const hit = getRaycastHit(e.clientX, e.clientY);
                    if (!hit) return;

                    if (appPhase === 'IDLE') {
                        zoomToLock();
                    } else if (appPhase === 'ZOOMED') {
                        const dIdx = hit.object.userData.dialIndex;
                        if (typeof dIdx === 'number') {
                            const wheelWorldPos = new THREE.Vector3();
                            hit.object.getWorldPosition(wheelWorldPos);
                            const delta = hit.point.y >= wheelWorldPos.y ? 1 : -1;
                            rotateDial(dIdx, delta);
                        }
                    }
                }
            });

            canvas.addEventListener('wheel', (e) => {
                if (appPhase !== 'ZOOMED') return;
                const hit = getRaycastHit(e.clientX, e.clientY);
                if (hit && typeof hit.object.userData.dialIndex === 'number') {
                    e.preventDefault();
                    const delta = e.deltaY < 0 ? 1 : -1;
                    rotateDial(hit.object.userData.dialIndex, delta);
                }
            }, { passive: false });
        }

        // =========================================================================
        // 7. HLAVNÍ ANIMAČNÍ SMYČKA (60 FPS)
        // =========================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            camCurrentPos.lerp(camTargetPos, 0.075);
            camCurrentLook.lerp(camTargetLook, 0.075);
            camera.position.copy(camCurrentPos);
            camera.lookAt(camCurrentLook);

            currentChestRotY += (targetChestRotY - currentChestRotY) * 0.08;
            if (chestRoot) {
                chestRoot.rotation.y = currentChestRotY;
                chestRoot.position.y = appPhase === 'IDLE' ? Math.sin(elapsed * 1.8) * 0.03 : 0;
            }

            const stepAngle = (Math.PI * 2) / 10;
            for (let i = 0; i < DIAL_COUNT; i++) {
                if (dialPivots[i]) {
                    const targetAngle = dialVisualSteps[i] * stepAngle;
                    dialCurrentAngles[i] += (targetAngle - dialCurrentAngles[i]) * 0.22;
                    dialPivots[i].rotation.x = dialCurrentAngles[i];
                }
            }

            const isOpened = appPhase === 'OPEN';
            const targetLidAngle = isOpened ? -1.78 : 0;
            const targetLatchY = isOpened ? 0.24 : 0.06;
            const targetLightIntensity = isOpened ? 2.6 + Math.sin(elapsed * 5) * 0.35 : 0;

            if (lidPivot) {
                lidPivot.rotation.x += (targetLidAngle - lidPivot.rotation.x) * 0.07;
            }
            if (latchSlider) {
                latchSlider.position.y += (targetLatchY - latchSlider.position.y) * 0.14;
            }
            if (treasureLight) {
                treasureLight.intensity += (targetLightIntensity - treasureLight.intensity) * 0.1;
            }

            if (dustPoints3D) {
                dustPoints3D.rotation.y = elapsed * 0.03;
            }

            renderer.render(scene, camera);
        }

        window.onload = function () {
            init3DScene();
        };
    </script>
</body>
</html>
